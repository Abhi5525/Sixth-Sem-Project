{% extends 'home/base-navbar.html' %}


{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3>Reset Password</h3>
            </div>
            <div class="card-body">
                <p>Enter your email address below, and we'll send you instructions for setting a new password.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label for="id_email">Email:</label>
                        <input type="email" name="email" class="form-control" 
                               id="id_email" 
                               placeholder="Enter your email address">
                        <span class="error-message" id="emailError" style="color: #dc3545; font-size: 0.875rem; display: none; margin-top: 0.25rem;"></span>
                        {% if form.email.errors %}
                            <div class="text-danger">
                                {{ form.email.errors }}
                            </div>
                        {% endif %}
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">
                        Send Reset Instructions
                    </button>
                </form>
                
                <div class="mt-3 text-center">
                    <a href="{% url 'login' %}">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelector('form').addEventListener('submit', function(e) {
    const email = document.getElementById('id_email').value.trim();
    const emailError = document.getElementById('emailError');
    const emailInput = document.getElementById('id_email');
    
    // Clear previous error
    emailError.style.display = 'none';
    emailInput.classList.remove('is-invalid');
    
    if (!email) {
        e.preventDefault();
        emailError.textContent = 'Email is required';
        emailError.style.display = 'block';
        emailInput.classList.add('is-invalid');
        return false;
    }
    
    // Basic email format validation
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
        e.preventDefault();
        emailError.textContent = 'Please enter a valid email address';
        emailError.style.display = 'block';
        emailInput.classList.add('is-invalid');
        return false;
    }
});
</script>
{% endblock %}
{% endblock %}
