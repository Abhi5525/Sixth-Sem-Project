<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Booking Details Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Poppins Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(145deg, #e3f0ff 0%, #b6d0f7 100%);
            /* Blue background */
            min-height: 100vh;
            font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
            color: #2d3748;
            line-height: 1.7;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        .booking-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 2.5rem 2rem;
            margin: auto;
            max-width: 650px;
            border: 1px solid rgba(52, 120, 246, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .booking-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 48px rgba(52, 120, 246, 0.12);
        }

        h2.text-primary {
            font-weight: 700;
            font-size: 2.3rem;
            letter-spacing: -0.015rem;
            background: linear-gradient(90deg, #2563eb, #38bdf8);
            /* Blue gradient for title */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .form-label {
            position: absolute;
            top: 1.1rem;
            left: 3.5rem;
            color: #6b7280;
            font-size: 1rem;
            font-weight: 500;
            pointer-events: none;
            transition: all 0.2s ease;
            padding: 0 0.3rem;
            background: #ffffff;
            z-index: 1;
        }

        .form-control,
        .form-select,
        textarea {
            width: 100%;
            border: 1px solid #93c5fd;
            border-radius: 12px;
            padding: 1.2rem 1rem 0.6rem 3.5rem;
            background: #f4faff;
            font-size: 1rem;
            color: #2d3748;
            transition: all 0.3s ease;
        }

        .form-control:focus,
        .form-select:focus,
        textarea:focus {
            border-color: #1e40af;
            background: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(30, 64, 175, 0.15);
            outline: none;
        }

        .form-control:focus+.form-label,
        .form-control:not(:placeholder-shown)+.form-label,
        .form-select:focus+.form-label,
        .form-select:not(:has(option[value=""]:selected))+.form-label,
        textarea:focus+.form-label,
        textarea:not(:placeholder-shown)+.form-label {
            top: -0.6rem;
            font-size: 0.85rem;
            color: #1e40af;
            padding: 0 0.4rem;
        }

        .form-control::placeholder,
        textarea::placeholder {
            color: transparent;
        }

        .form-control:hover,
        .form-select:hover,
        textarea:hover {
            border-color: #1e40af;
            box-shadow: 0 0 8px rgba(30, 64, 175, 0.08);
        }

        /* Specific styling for Date and Time fields */
        .date-group .form-control,
        .time-group .form-control {
            background: #f4faff;
            border-radius: 12px;
            padding: 1.2rem 1rem 0.6rem 3.5rem;
            font-size: 1rem;
        }

        .date-group .form-control:focus,
        .time-group .form-control:focus {
            background: #ffffff;
            border-color: #1e40af;
            box-shadow: 0 0 0 0.25rem rgba(30, 64, 175, 0.15);
        }

        .date-group .form-control:hover,
        .time-group .form-control:hover {
            border-color: #1e40af;
            box-shadow: 0 0 8px rgba(30, 64, 175, 0.08);
        }

        .icon-input .bi {
            position: absolute;
            left: 1.2rem;
            top: 1.1rem;
            color: #9ca3af;
            font-size: 1.25rem;
            transition: color 0.3s ease, transform 0.3s ease;
            z-index: 1;
        }

        .icon-input .form-control:focus~.bi,
        .icon-input .form-select:focus~.bi,
        .icon-input textarea:focus~.bi {
            color: #1e40af;
            transform: scale(1.1);
        }

        .btn-primary {
            display: inline-block;
            width: 100%;
            text-align: center;
            background: linear-gradient(90deg, #2563eb 0%, #38bdf8 100%);
            /* Blue gradient for submit */
            color: #fff;
            font-weight: 600;
            padding: 1rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.18);
        }

        .btn-primary:hover {
            background: linear-gradient(90deg, #1e40af 0%, #0ea5e9 100%);
            /* Darker blue on hover */
            box-shadow: 0 8px 28px rgba(37, 99, 235, 0.22);
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        /* Accessibility */
        :focus-visible {
            outline: 3px solid #1e40af;
            outline-offset: 4px;
        }

        /* Responsive adjustments */
        @media (max-width: 991px) {
            .booking-card {
                padding: 2rem 1.5rem;
                max-width: 90%;
            }

            h2.text-primary {
                font-size: 1.9rem;
            }

            .form-label {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 767px) {
            .booking-card {
                padding: 1.5rem 1rem;
                max-width: 95%;
            }

            h2.text-primary {
                font-size: 1.6rem;
            }

            .form-control,
            .form-select,
            textarea {
                font-size: 0.95rem;
                padding: 1rem 0.9rem 0.5rem 3.2rem;
            }

            .form-label {
                top: 1rem;
                left: 3.2rem;
            }

            .icon-input .bi {
                font-size: 1.15rem;
                top: 1rem;
            }

            .btn-primary {
                padding: 0.85rem;
            }
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row center-row">
            <div class="col-12 col-md-10 col-lg-8 col-xl-6 mx-auto">
                <div class="booking-card shadow-lg">
                    <h2 class="text-primary fw-bold">
                        <i class="bi bi-calendar2-check"></i> Booking Details
                    </h2>
                    <form method="post" action="" autocomplete="on" aria-label="Booking Details Form">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6 form-group icon-input">
                                <input type="text" id="name" name="name" class="form-control" required
                                    placeholder="Enter your full name">
                                <label for="name" class="form-label">Full Name</label>
                                <i class="bi bi-person"></i>
                            </div>
                            <div class="col-md-6 form-group icon-input">
                                <input type="tel" id="phone" name="phone" class="form-control" required
                                    pattern="[0-9]{10,15}" placeholder="e.g. 9876543210">
                                <label for="phone" class="form-label">Phone Number</label>
                                <i class="bi bi-telephone"></i>
                            </div>
                            <div class="col-md-6 form-group icon-input">
                                <input type="email" id="email" name="email" class="form-control" required
                                    placeholder="you@example.com">
                                <label for="email" class="form-label">Email Address</label>
                                <i class="bi bi-envelope"></i>
                            </div>
                            <div class="col-md-6 form-group icon-input">
                                <input type="text" id="location" name="location" class="form-control" required
                                    placeholder="e.g. Munich">
                                <label for="location" class="form-label">Location (City/Area)</label>
                                <i class="bi bi-geo-alt"></i>
                            </div>
                            <div class="col-12 form-group icon-input">
                                <textarea id="address" name="address" rows="2" class="form-control" required
                                    placeholder="Enter your address"></textarea>
                                <label for="address" class="form-label">Service Address</label>
                                <i class="bi bi-house"></i>
                            </div>

                            <div class="col-md-6 d-flex">
                                <div class="form-group icon-input date-group flex-fill me-2">
                                    <input type="date" id="date" name="date" class="form-control" required>
                                    <label for="date" class="form-label">Preferred Date</label>
                                    <i class="bi bi-calendar-event"></i>
                                </div>
                            </div>

                            <div class="col-md-6 d-flex">
                                <div class="form-group icon-input time-group flex-fill ms-2">
                                    <input type="time" id="time" name="time" class="form-control" required>
                                    <label for="time" class="form-label">Preferred Time</label>
                                    <i class="bi bi-clock"></i>
                                </div>
                            </div>

                        </div>
                        <div class="col-12 form-group icon-input">
                            <textarea id="notes" name="notes" rows="2" class="form-control"
                                placeholder="Any special instructions?"></textarea>
                            <label for="notes" class="form-label">Additional Notes</label>
                            <i class="bi bi-chat-dots"></i>
                        </div>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-check-circle me-2"></i> Confirm Booking
                    </button>
                </div>
                </form>
            </div>
        </div>
    </div>
    </div>
    <!-- Bootstrap JS (for interactivity, optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
