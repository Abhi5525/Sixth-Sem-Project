<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .success-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .success-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            position: relative;
            z-index: 1;
        }

        .checkmark {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            position: relative;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.3);
            animation: scaleIn 0.6s ease-out;
        }

        .checkmark::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            animation: checkmarkPop 0.8s ease-out 0.3s both;
        }

        @keyframes scaleIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes checkmarkPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        h2 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 700;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out 0.5s both;
        }

        .details-container {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            padding: 30px;
            margin: 30px 0;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(102, 126, 234, 0.2);
            animation: fadeInUp 0.8s ease-out 0.7s both;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #666;
            font-size: 1rem;
        }

        .detail-value {
            font-weight: 700;
            color: #2c3e50;
            font-size: 1.1rem;
        }

        .amount {
            color: #4CAF50;
            font-size: 1.3rem;
        }

        .message {
            color: #7f8c8d;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-top: 20px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out 0.9s both;
        }

        .continue-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            animation: fadeInUp 0.8s ease-out 1.1s both;
        }

        .continue-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .success-container {
                padding: 40px 20px;
                margin: 20px;
            }

            h2 {
                font-size: 2rem;
            }

            .detail-item {
                flex-direction: column;
                text-align: center;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">
            <div class="checkmark"></div>
        </div>
        
        <h2>Payment Successful!</h2>
        
        <div class="details-container">
            <div class="detail-item">
                <span class="detail-label">Booking ID:</span>
                <span class="detail-value">{{ booking.id }}</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Professional:</span>
                <span class="detail-value">{{ booking.professional.user.full_name }}</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Amount Paid:</span>
                <span class="detail-value amount">NPR {{ booking.deposit_amount }}</span>
            </div>
        </div>
        
        <p class="message">
            Your booking has been confirmed! You will receive a confirmation email shortly with all the details.
        </p>
        
        <button class="continue-btn" onclick="window.location.href='/'">
            Continue to Home
        </button>
    </div>
</body>
</html>
