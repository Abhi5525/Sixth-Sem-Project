{% extends "home/base-navbar.html" %}
{% block main-content %}
<div class="container py-5">
    <div class="">
        <p id="locationStatus" class="form-label" style="color: blue;">Detecting your location...</p>
    </div>
    
    <div class="booking-card">
        <h2 class="text-primary">Book {{ professional.full_name }}</h2>
        <form id="bookingForm">
            {% csrf_token %}
            
            <div class="form-group icon-input">
                <input type="text" id="name" name="name" class="form-control" placeholder="Name" required>
                <label for="name" class="form-label">Your Name</label>
                <i class="bi bi-person"></i>
            </div>

            <div class="form-group icon-input">
                <input type="date" id="date" name="date" class="form-control" placeholder=" " required>
                <label for="date" class="form-label">Booking Date</label>
                <i class="bi bi-calendar"></i>
            </div>

            <div class="form-group icon-input">
                <input type="time" id="time" name="time" class="form-control" placeholder=" " required>
                <label for="time" class="form-label">Booking Time</label>
                <i class="bi bi-clock"></i>
            </div>

            <!-- New Duration Field -->
            <div class="form-group icon-input">
                <input type="number" id="durationHours" name="duration_hours" class="form-control" placeholder=" " min="1" step="0.5" required>
                <label for="durationHours" class="form-label">Duration (Hours)</label>
                <i class="bi bi-hourglass-split"></i>
            </div>
            
            <button type="submit" class="btn-primary">Confirm Booking</button>
        </form>
    </div>
</div>

<script>
let userLatitude = null;
let userLongitude = null;

// Get user location
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        (position) => {
            userLatitude = position.coords.latitude;
            userLongitude = position.coords.longitude;
            document.getElementById("locationStatus").innerText = "Location detected ✔";
        },
        (error) => {
            console.error("Location permission denied:", error);
            document.getElementById("locationStatus").innerText = "Location not detected ❌";
            alert("We need your location to proceed with booking.");
        }
    );
}

// Handle form submit
document.getElementById("bookingForm").addEventListener("submit", function(e) {
    e.preventDefault(); // Stop normal submission
    submitBooking();
});

function submitBooking() {
    const name = document.getElementById("name").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const durationHours = document.getElementById("durationHours").value;

    if (!userLatitude || !userLongitude) {
        alert("Waiting for your location...");
        return;
    }

    // Combine date and time into ISO datetime
    const bookingTime = `${date}T${time}:00`;

    fetch(window.location.href, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie('csrftoken')
        },
        body: JSON.stringify({
            name: name,
            booking_time: bookingTime,
            duration_hours: durationHours,
            latitude: userLatitude,
            longitude: userLongitude
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert("Booking successful! Redirecting to payment...");
            window.location.href = `/bookings/checkout/${data.booking_id}/`;
        } else {
            alert("Error: " + data.error);
        }
    })
    .catch(error => {
        console.error("Fetch error:", error);
        alert("Something went wrong. Try again.");
    });
}

// Helper for CSRF token
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}

{% block styles %}
<style>
/* ---- Booking Card ---- */
#locationStatus {
    text-align: center;
    color: blue;
    margin: 75px;
    margin-left: 40%;
}

.booking-card {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.97);
    backdrop-filter: blur(16px);
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    padding: 2.5rem 2rem;
    margin: auto;
    max-width: 650px;
    border: 1px solid rgba(52, 120, 246, 0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.booking-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 14px 48px rgba(52, 120, 246, 0.12);
}

h2.text-primary {
    font-weight: 700;
    font-size: 2.3rem;
    letter-spacing: -0.015rem;
    background: linear-gradient(90deg, #2563eb, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    margin-bottom: 2rem;
}

/* ---- Form Fields ---- */
.form-group {
    position: relative;
    margin-bottom: 1.5rem;
}
.form-label {
    position: absolute;
    top: 1.1rem;
    left: 3.5rem;
    color: #6b7280;
    font-size: 1rem;
    font-weight: 500;
    pointer-events: none;
    transition: all 0.2s ease;
    padding: 0 0.3rem;
    background: #ffffff;
    z-index: 1;
}
.form-control {
    width: 100%;
    border: 1px solid #93c5fd;
    border-radius: 12px;
    padding: 1.2rem 1rem 0.6rem 3.5rem;
    background: #f4faff;
    font-size: 1rem;
    color: #2d3748;
    transition: all 0.3s ease;
}
.form-control:focus + .form-label,
.form-control:not(:placeholder-shown) + .form-label {
    top: -0.6rem;
    font-size: 0.85rem;
    color: #1e40af;
    padding: 0 0.4rem;
}

/* ---- Icons inside inputs ---- */
.icon-input .bi {
    position: absolute;
    left: 1.2rem;
    top: 1.1rem;
    color: #9ca3af;
    font-size: 1.25rem;
    z-index: 1;
}
.icon-input .form-control:focus ~ .bi {
    color: #1e40af;
    transform: scale(1.1);
}

/* ---- Button ---- */
.btn-primary {
    display: inline-block;
    width: 100%;
    text-align: center;
    background: linear-gradient(90deg, #2563eb 0%, #38bdf8 100%);
    color: #fff;
    font-weight: 600;
    padding: 1rem;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.18);
}
.btn-primary:hover {
    background: linear-gradient(90deg, #1e40af 0%, #0ea5e9 100%);
    box-shadow: 0 8px 28px rgba(37, 99, 235, 0.22);
    transform: translateY(-2px);
}
</style>
{% endblock %}
