{% extends "home/base-navbar.html" %}
{% block main-content %}
{% load static %}

<link rel="stylesheet" href="{% static 'bookings/css/bookingform.css' %}">
<div class="container py-5">
    {% comment %} <div class="">
        <p id="locationStatus" class="form-label" style="color: blue;">Detecting your location...</p>
    </div>
     {% endcomment %}
    <div class="booking-card">
        <h2 class="text-primary">Book {{ professional.full_name }}</h2>
        <form id="bookingForm">
            {% csrf_token %}
            
            <div class="form-group icon-input">
                <input type="text" id="name" name="name" class="form-control" placeholder="Name" required>
                <label for="name" class="form-label">Your Name</label>
                <i class="bi bi-person"></i>
            </div>

            <div class="form-group icon-input">
    <input type="date" id="date" name="date" class="form-control" 
           placeholder=" " required 
           min="{{ today|date:'Y-m-d' }}">
    <label for="date" class="form-label">Booking Date</label>
    <i class="bi bi-calendar"></i>
</div>
            <div class="form-group icon-input">
                <input type="time" id="time" name="time" class="form-control" placeholder=" " required>
                <label for="time" class="form-label">Booking Time</label>
                <i class="bi bi-clock"></i>
            </div>

            <!-- New Duration Field -->
            <div class="form-group icon-input">
                <input type="number" id="durationHours" name="duration_hours" class="form-control" placeholder=" " min="1" step="0.5" required>
                <label for="durationHours" class="form-label">Duration (Hours)</label>
                <i class="bi bi-hourglass-split"></i>
            </div>
            <!-- In your HTML template -->
<input type="hidden" id="professional_id" value="{{ professional.id }}">
            <button type="submit" class="btn-primary">Confirm Booking</button>
        </form>
    </div>
</div>

<script>
const lat = localStorage.getItem("userLat");
const lng = localStorage.getItem("userLng");
 const professionalId = document.getElementById("professional_id").value;
let userLatitude = lat ? parseFloat(lat) : null;
let userLongitude = lng ? parseFloat(lng) : null;
// Handle form submit
document.getElementById("bookingForm").addEventListener("submit", function(e) {
    e.preventDefault(); // Stop normal submission
    submitBooking();
});

function submitBooking() {
    const name = document.getElementById("name").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;
    const durationHours = document.getElementById("durationHours").value;
    const professionalId = document.getElementById("professional_id").value;

    if (!userLatitude || !userLongitude) {
        alert("Waiting for your location...");
        return;
    }

    // Combine date and time into ISO datetime
    const localDate = new Date(`${date}T${time}:00`);
    const bookingTime = localDate.toISOString();
    
    // Client-side validation: Check if booking is at least 1 hour from now
    const now = new Date();
    const oneHourFromNow = new Date(now.getTime() + (60 * 60 * 1000)); // Add 1 hour
    
    if (localDate < oneHourFromNow) {
        const minTime = oneHourFromNow.toLocaleString();
        alert(`Bookings must be made at least 1 hour in advance.\nEarliest available time is: ${minTime}`);
        return;
    }

    fetch(window.location.href, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie('csrftoken')
        },
        body: JSON.stringify({
            name: name,
            professional_id: professionalId,
            booking_time: bookingTime,
            duration_hours: durationHours,
            latitude: userLatitude,
            longitude: userLongitude
        })
    })
    .then(response => response.json())
    .then(data => {
        console.log("Server response:", data);
        if (data.success) {
            alert("Booking successful! Redirecting to payment...");
            window.location.href = `/bookings/checkout/${data.booking_id}/`;
        } else {
            alert("Error: " + data.error);
        }
    })
    .catch(error => {
        console.error("Fetch error:", error);
        alert("Something went wrong. Try again.");
    });
}
// Helper for CSRF token
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
