{% extends 'home/base-navbar.html' %}
{% load static %}
{% block main-content %}

<link rel="stylesheet" href="{% static 'bookings/css/bookingform.css' %}" />
<div class="container py-5">
  {% comment %} <div class="">
    <p id="locationStatus" class="form-label" style="color: blue;">Detecting your location...</p>
  </div>
  {% endcomment %}
  <div class="booking-card">
    <h2 class="text-primary">Book {{ professional.full_name }}</h2>
    <form id="bookingForm">
      {% csrf_token %}

      <div class="form-group icon-input">
        <input type="text" id="name" name="name" class="form-control" placeholder=" " autocomplete="name" value="{{ default_client_name }}" />
        <label for="name" class="form-label">Your Name</label>
        <span class="error-message" id="nameError"></span>
        <i class="bi bi-person"></i>
      </div>

      <div class="form-group icon-input">
        <input type="text" id="phone" name="phone" class="form-control" placeholder=" " autocomplete="tel" inputmode="numeric" value="{{ default_client_phone }}" />
        <label for="phone" class="form-label">Phone Number</label>
        <span class="error-message" id="phoneError"></span>
        <i class="bi bi-telephone"></i>
      </div>

      <div class="form-group icon-input">
        <input type="date" id="date" name="date" class="form-control" placeholder=" " min="" />
        <label for="date" class="form-label">Booking Date</label>
        <span class="error-message" id="dateError"></span>
        <i class="bi bi-calendar"></i>
      </div>
      <div class="form-group icon-input">
        <input type="text" id="durationHours" name="duration_hours" class="form-control" placeholder=" " inputmode="decimal" />
        <label for="durationHours" class="form-label">Duration (Hours)</label>
        <span class="error-message" id="durationError"></span>
        <i class="bi bi-hourglass-split"></i>
      </div>
      <div class="form-group icon-input">
        <select id="time" name="time" class="form-control" disabled>
          <option value="">Select date and duration first</option>
        </select>
        <label for="time" class="form-label">Booking Time</label>
        <span class="error-message" id="timeError"></span>
        <i class="bi bi-clock"></i>
      </div>
      <div class="form-group">
        <small id="slotInfo" class="text-muted d-block"></small>
      </div>

      <input type="hidden" id="professional_id" value="{{ professional.id }}" />
      <button type="submit" class="btn-primary">Confirm Booking</button>
    </form>
  </div>
</div>

<script>
  function pad(n) {
    return n.toString().padStart(2, '0');
  }

  function getTodayStr() {
    const now = new Date();
    return now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  }

  function normalizePhone(phone) {
    return (phone || '').replace(/\s+/g, '');
  }

  const dateInput = document.getElementById('date');
  const timeInput = document.getElementById('time');
  const nameInput = document.getElementById('name');
  const phoneInput = document.getElementById('phone');
  const durationInput = document.getElementById('durationHours');
  const slotInfo = document.getElementById('slotInfo');
  const professionalId = document.getElementById('professional_id').value;
  const locationScope = "{% if request.user.is_authenticated %}user_{{ request.user.id }}{% else %}anon{% endif %}";
  const scopedUserLatKey = `userLat:${locationScope}`;
  const scopedUserLngKey = `userLng:${locationScope}`;
  const legacyUserLatKey = 'userLat';
  const legacyUserLngKey = 'userLng';
  const serverLat = parseFloat("{{ user_lat|default_if_none:'' }}");
  const serverLng = parseFloat("{{ user_lng|default_if_none:'' }}");
  const BOOKING_START_HOUR = 6;
  const BOOKING_END_HOUR = 20;

  function resolveBookingLocation() {
    const scopedLat = parseFloat(localStorage.getItem(scopedUserLatKey));
    const scopedLng = parseFloat(localStorage.getItem(scopedUserLngKey));
    if (Number.isFinite(scopedLat) && Number.isFinite(scopedLng)) {
      return { lat: scopedLat, lng: scopedLng };
    }

    const legacyLat = parseFloat(localStorage.getItem(legacyUserLatKey));
    const legacyLng = parseFloat(localStorage.getItem(legacyUserLngKey));
    if (Number.isFinite(legacyLat) && Number.isFinite(legacyLng)) {
      return { lat: legacyLat, lng: legacyLng };
    }

    if (Number.isFinite(serverLat) && Number.isFinite(serverLng)) {
      return { lat: serverLat, lng: serverLng };
    }

    return { lat: null, lng: null };
  }

  function setDateMinConstraint() {
    const today = getTodayStr();
    dateInput.setAttribute('min', today);
    if (dateInput.value && dateInput.value < today) {
      dateInput.value = '';
    }
  }

  function resetSlotDropdown(message) {
    timeInput.innerHTML = `<option value="">${message}</option>`;
    timeInput.disabled = true;
  }

  function setSlotLoadingState() {
    resetSlotDropdown('Loading available slots...');
    slotInfo.textContent = '';
  }

  function renderSlots(slots) {
    if (!Array.isArray(slots) || slots.length === 0) {
      resetSlotDropdown('No available time slots for this date');
      slotInfo.textContent = 'Try a different date or shorter duration.';
      return;
    }

    const options = ['<option value="">Select available time slot</option>'];
    slots.forEach((slot) => {
      options.push(`<option value="${slot.value}">${slot.label}</option>`);
    });
    timeInput.innerHTML = options.join('');
    timeInput.disabled = false;
    slotInfo.textContent = `${slots.length} slot(s) available for selected date.`;
  }

  async function fetchAvailableSlots() {
    const selectedDate = dateInput.value;
    const durationRaw = durationInput.value.trim();

    if (!selectedDate) {
      resetSlotDropdown('Select booking date first');
      slotInfo.textContent = '';
      return;
    }

    const duration = parseFloat(durationRaw || '1');
    if (Number.isNaN(duration) || duration < 0.5 || duration > 24) {
      resetSlotDropdown('Enter valid duration first');
      slotInfo.textContent = '';
      return;
    }

    setSlotLoadingState();
    try {
      const url = `/bookings/available-slots/${professionalId}/?date=${encodeURIComponent(selectedDate)}&duration_hours=${encodeURIComponent(duration)}`;
      const response = await fetch(url, {
        method: 'GET',
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      });
      const data = await response.json();

      if (!response.ok || !data.success) {
        resetSlotDropdown('Could not load slots');
        slotInfo.textContent = data.error || 'Unable to fetch available slots right now.';
        return;
      }

      renderSlots(data.slots);
    } catch (error) {
      console.error('Slot fetch error:', error);
      resetSlotDropdown('Could not load slots');
      slotInfo.textContent = 'Network error while fetching available slots.';
    }
  }

  dateInput.addEventListener('change', function () {
    setDateMinConstraint();
    validateField('date');
    fetchAvailableSlots();
  });

  durationInput.addEventListener('change', function () {
    validateField('duration');
    fetchAvailableSlots();
  });

  durationInput.addEventListener('input', function () {
    clearError('duration');
    if (dateInput.value) {
      fetchAvailableSlots();
    }
  });

  setDateMinConstraint();
  resetSlotDropdown('Select date and duration first');

  // Clear error on user interaction
  [nameInput, phoneInput, dateInput, timeInput].forEach((input) => {
    if (input) {
      input.addEventListener('input', () => {
        const fieldId = input === durationInput ? 'duration' : input.id;
        clearError(fieldId);
      });
      input.addEventListener('change', () => {
        const fieldId = input === durationInput ? 'duration' : input.id;
        validateField(fieldId);
      });
    }
  });

  // ============================
  // Field-level Validation
  // ============================
  function validateField(fieldId) {
    switch (fieldId) {
      case 'name': {
        const val = nameInput.value.trim();
        if (!val) return showFieldError('name', 'Name is required');
        if (!/^[A-Za-z]/.test(val)) return showFieldError('name', 'Name must start with a letter');
        if (!/^[a-zA-Z\s\-'.]+$/.test(val)) return showFieldError('name', 'Name can only contain letters, spaces, hyphens, and apostrophes');
        if (val.replace(/[^A-Za-z]/g, '').length < 3) return showFieldError('name', 'Name must contain at least 3 letters');
        return true;
      }
      case 'phone': {
        const val = normalizePhone(phoneInput.value);
        if (!val) return showFieldError('phone', 'Phone number is required');
        if (!/^98\d{8}$/.test(val)) return showFieldError('phone', 'Phone number must be 10 digits and start with 98');
        return true;
      }
      case 'date': {
        const val = dateInput.value;
        if (!val) return showFieldError('date', 'Booking date is required');
        if (val < getTodayStr()) return showFieldError('date', 'You cannot book a past date. Please select today or a future date.');
        return true;
      }
      case 'time': {
        const val = timeInput.value;
        if (!val) return showFieldError('time', 'Booking time is required');

        const [h, m] = val.split(':').map(Number);
        if (h < BOOKING_START_HOUR || h >= BOOKING_END_HOUR) {
          return showFieldError('time', 'Booking time must be between 6:00 AM and 8:00 PM');
        }
        return true;
      }
      case 'duration': {
        const val = durationInput.value.trim();
        if (!val) return showFieldError('duration', 'Duration is required');
        const num = parseFloat(val);
        if (isNaN(num)) return showFieldError('duration', 'Enter a valid number (e.g. 1, 1.5, 2)');
        if (num < 0.5) return showFieldError('duration', 'Minimum duration is 0.5 hours');
        if (num > 24) return showFieldError('duration', 'Maximum duration is 24 hours');
        return true;
      }
    }
  }

  function showFieldError(fieldId, message) {
    const errorEl = document.getElementById(fieldId + 'Error');
    const inputEl = document.getElementById(fieldId === 'duration' ? 'durationHours' : fieldId);
    if (errorEl) errorEl.textContent = message;
    if (inputEl) inputEl.classList.add('is-invalid');
    return false;
  }

  function clearError(fieldId) {
    const errorEl = document.getElementById(fieldId + 'Error');
    const inputEl = document.getElementById(fieldId === 'duration' ? 'durationHours' : fieldId);
    if (errorEl) errorEl.textContent = '';
    if (inputEl) inputEl.classList.remove('is-invalid');
  }

  function clearAllErrors() {
    ['name', 'phone', 'date', 'time', 'duration'].forEach(clearError);
  }

  // ============================
  // Form Submit Handler
  // ============================
  document.getElementById('bookingForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearAllErrors();

    // Validate all fields
    const nameOk = validateField('name');
    const phoneOk = validateField('phone');
    const dateOk = validateField('date');
    const timeOk = validateField('time');
    const durationOk = validateField('duration');

    if (nameOk && phoneOk && dateOk && timeOk && durationOk) {
      submitBooking();
    } else {
      // Scroll to first error field
      const firstError = document.querySelector('.form-control.is-invalid');
      if (firstError) firstError.focus();
    }
  });

  // ============================
  // AJAX Submit
  // ============================
  function submitBooking() {
    const name = nameInput.value.trim();
    const phone = normalizePhone(phoneInput.value);
    const date = dateInput.value;
    const time = timeInput.value;
    const durationHours = durationInput.value.trim();

    const location = resolveBookingLocation();
    const userLat = location.lat;
    const userLng = location.lng;

    if (!Number.isFinite(userLat) || !Number.isFinite(userLng)) {
      alert('Waiting for your location...');
      return;
    }

    // Combine date + time into ISO datetime
    const localDate = new Date(`${date}T${time}:00`);
    const bookingTime = localDate.toISOString();

    const selectedHour = localDate.getHours();
    if (selectedHour < BOOKING_START_HOUR || selectedHour >= BOOKING_END_HOUR) {
      alert('Booking time must be between 6:00 AM and 8:00 PM.');
      return;
    }

    fetch(window.location.href, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken')
      },
      body: JSON.stringify({
        name: name,
        phone: phone,
        professional_id: professionalId,
        booking_time: bookingTime,
        duration_hours: durationHours,
        latitude: userLat,
        longitude: userLng
      })
    })
      .then((response) => response.json())
      .then((data) => {
        if (data.success) {
          alert('Booking successful! Redirecting to payment...');
          window.location.href = `/bookings/checkout/${data.booking_id}/`;
        } else {
          alert('Error: ' + data.error);
        }
      })
      .catch((error) => {
        console.error('Fetch error:', error);
        alert('Something went wrong. Please try again.');
      });
  }

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === name + '=') {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
</script>
{% endblock %}
