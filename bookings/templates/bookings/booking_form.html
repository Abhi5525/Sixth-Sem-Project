{% extends 'home/base-navbar.html' %}
{% load static %}
{% block main-content %}

<link rel="stylesheet" href="{% static 'bookings/css/bookingform.css' %}" />
<div class="container py-5">
  {% comment %} <div class="">
    <p id="locationStatus" class="form-label" style="color: blue;">Detecting your location...</p>
  </div>
  {% endcomment %}
  <div class="booking-card">
    <h2 class="text-primary">Book {{ professional.full_name }}</h2>
    <form id="bookingForm">
      {% csrf_token %}

      <div class="form-group icon-input">
        <input type="text" id="name" name="name" class="form-control" placeholder=" " autocomplete="name" />
        <label for="name" class="form-label">Your Name</label>
        <span class="error-message" id="nameError"></span>
        <i class="bi bi-person"></i>
      </div>

      <div class="form-group icon-input">
        <input type="date" id="date" name="date" class="form-control" placeholder=" " min="" />
        <label for="date" class="form-label">Booking Date</label>
        <span class="error-message" id="dateError"></span>
        <i class="bi bi-calendar"></i>
      </div>
      <div class="form-group icon-input">
        <input type="time" id="time" name="time" class="form-control" placeholder=" " />
        <label for="time" class="form-label">Booking Time</label>
        <span class="error-message" id="timeError"></span>
        <i class="bi bi-clock"></i>
      </div>

      <div class="form-group icon-input">
        <input type="text" id="durationHours" name="duration_hours" class="form-control" placeholder=" " inputmode="decimal" />
        <label for="durationHours" class="form-label">Duration (Hours)</label>
        <span class="error-message" id="durationError"></span>
        <i class="bi bi-hourglass-split"></i>
      </div>

      <input type="hidden" id="professional_id" value="{{ professional.id }}" />
      <button type="submit" class="btn-primary">Confirm Booking</button>
    </form>
  </div>
</div>

<script>
  // ============================
  // Helpers
  // ============================
  function pad(n) {
    return n.toString().padStart(2, '0');
  }

  function getTodayStr() {
    const now = new Date();
    return now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  }

  // ============================
  // Date/Time Dynamic Constraints
  // ============================
  const dateInput = document.getElementById('date');
  const timeInput = document.getElementById('time');
  const nameInput = document.getElementById('name');
  const durationInput = document.getElementById('durationHours');

  function setDateMinConstraint() {
    const today = getTodayStr();
    dateInput.setAttribute('min', today);
    if (dateInput.value && dateInput.value < today) {
      dateInput.value = '';
    }
  }

  // NOTE: No HTML5 min/step attributes — all constraints enforced via JS

  function updateMinTime() {
    const now = new Date();
    const selectedDate = dateInput.value;
    if (!selectedDate) return;

    if (selectedDate === getTodayStr()) {
      const minTime = new Date(now.getTime() + 30 * 60 * 1000);
      const minTimeString = pad(minTime.getHours()) + ':' + pad(minTime.getMinutes());
      timeInput.setAttribute('min', minTimeString);

      // Clear previously selected time if it's now invalid
      if (timeInput.value && timeInput.value < minTimeString) {
        timeInput.value = '';
        clearError('time');
      }
    } else {
      // Future date — no time restriction
      timeInput.removeAttribute('min');
    }
  }

  dateInput.addEventListener('change', function () {
    setDateMinConstraint();
    updateMinTime();
    // Validate date field on change
    validateField('date');
  });

  setDateMinConstraint();
  updateMinTime();

  // Clear error on user interaction
  [nameInput, dateInput, timeInput, durationInput].forEach((input) => {
    if (input) {
      input.addEventListener('input', () => {
        const fieldId = input === durationInput ? 'duration' : input.id;
        clearError(fieldId);
      });
      input.addEventListener('change', () => {
        const fieldId = input === durationInput ? 'duration' : input.id;
        validateField(fieldId);
      });
    }
  });

  // ============================
  // Field-level Validation
  // ============================
  function validateField(fieldId) {
    switch (fieldId) {
      case 'name': {
        const val = nameInput.value.trim();
        if (!val) return showFieldError('name', 'Name is required');
        if (!/^[A-Za-z]/.test(val)) return showFieldError('name', 'Name must start with a letter');
        if (!/^[a-zA-Z\s\-'.]+$/.test(val)) return showFieldError('name', 'Name can only contain letters, spaces, hyphens, and apostrophes');
        if (val.replace(/[^A-Za-z]/g, '').length < 3) return showFieldError('name', 'Name must contain at least 3 letters');
        return true;
      }
      case 'date': {
        const val = dateInput.value;
        if (!val) return showFieldError('date', 'Booking date is required');
        if (val < getTodayStr()) return showFieldError('date', 'You cannot book a past date. Please select today or a future date.');
        return true;
      }
      case 'time': {
        const val = timeInput.value;
        if (!val) return showFieldError('time', 'Booking time is required');

        // If date is today, time must be ≥ 30 min from now
        if (dateInput.value === getTodayStr()) {
          const now = new Date();
          const minTime = new Date(now.getTime() + 30 * 60 * 1000);
          const [h, m] = val.split(':').map(Number);
          const selected = new Date();
          selected.setHours(h, m, 0, 0);
          if (selected < minTime) {
            const minStr = pad(minTime.getHours()) + ':' + pad(minTime.getMinutes());
            return showFieldError('time', `Time must be at least 30 min from now. Earliest: ${minStr}`);
          }
        }
        return true;
      }
      case 'duration': {
        const val = durationInput.value.trim();
        if (!val) return showFieldError('duration', 'Duration is required');
        const num = parseFloat(val);
        if (isNaN(num)) return showFieldError('duration', 'Enter a valid number (e.g. 1, 1.5, 2)');
        if (num < 0.5) return showFieldError('duration', 'Minimum duration is 0.5 hours');
        if (num > 24) return showFieldError('duration', 'Maximum duration is 24 hours');
        return true;
      }
    }
  }

  function showFieldError(fieldId, message) {
    const errorEl = document.getElementById(fieldId + 'Error');
    const inputEl = document.getElementById(fieldId === 'duration' ? 'durationHours' : fieldId);
    if (errorEl) errorEl.textContent = message;
    if (inputEl) inputEl.classList.add('is-invalid');
    return false;
  }

  function clearError(fieldId) {
    const errorEl = document.getElementById(fieldId + 'Error');
    const inputEl = document.getElementById(fieldId === 'duration' ? 'durationHours' : fieldId);
    if (errorEl) errorEl.textContent = '';
    if (inputEl) inputEl.classList.remove('is-invalid');
  }

  function clearAllErrors() {
    ['name', 'date', 'time', 'duration'].forEach(clearError);
  }

  // ============================
  // Form Submit Handler
  // ============================
  document.getElementById('bookingForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearAllErrors();

    // Validate all fields
    const nameOk = validateField('name');
    const dateOk = validateField('date');
    const timeOk = validateField('time');
    const durationOk = validateField('duration');

    if (nameOk && dateOk && timeOk && durationOk) {
      submitBooking();
    } else {
      // Scroll to first error field
      const firstError = document.querySelector('.form-control.is-invalid');
      if (firstError) firstError.focus();
    }
  });

  // ============================
  // AJAX Submit
  // ============================
  function submitBooking() {
    const name = nameInput.value.trim();
    const date = dateInput.value;
    const time = timeInput.value;
    const durationHours = durationInput.value.trim();
    const professionalId = document.getElementById('professional_id').value;

    const lat = localStorage.getItem('userLat');
    const lng = localStorage.getItem('userLng');
    const userLat = lat ? parseFloat(lat) : null;
    const userLng = lng ? parseFloat(lng) : null;

    if (!userLat || !userLng) {
      alert('Waiting for your location...');
      return;
    }

    // Combine date + time into ISO datetime
    const localDate = new Date(`${date}T${time}:00`);
    const bookingTime = localDate.toISOString();

    // Client-side: must be ≥ 30 min from now
    const now = new Date();
    const minTimeFromNow = new Date(now.getTime() + 30 * 60 * 1000);
    if (localDate < minTimeFromNow) {
      const minStr = minTimeFromNow.toLocaleString();
      alert(`Bookings must be at least 30 minutes in advance.\nEarliest available: ${minStr}`);
      return;
    }

    fetch(window.location.href, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken')
      },
      body: JSON.stringify({
        name: name,
        professional_id: professionalId,
        booking_time: bookingTime,
        duration_hours: durationHours,
        latitude: userLat,
        longitude: userLng
      })
    })
      .then((response) => response.json())
      .then((data) => {
        if (data.success) {
          alert('Booking successful! Redirecting to payment...');
          window.location.href = `/bookings/checkout/${data.booking_id}/`;
        } else {
          alert('Error: ' + data.error);
        }
      })
      .catch((error) => {
        console.error('Fetch error:', error);
        alert('Something went wrong. Please try again.');
      });
  }

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === name + '=') {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
</script>
{% endblock %}
