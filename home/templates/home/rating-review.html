{% load static %}
{% block styles %}

<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f7fa;
}

/* Modal Overlay */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

/* Modal Container */
.modal-container {
    background: white;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    width: 100%;
    max-width: 380px;
    overflow: hidden;
    animation: slideIn 0.25s ease-out;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Header */
.modal-header {
    background: #1976d2;
    color: white;
    padding: 14px;
    text-align: center;
    border-bottom: 2px solid #1565c0;
}

.modal-header h2 {
    font-size: 1.2rem;
    margin-bottom: 4px;
}

.modal-header p {
    font-size: 0.9rem;
    opacity: 0.9;
}

/* Body */
.modal-body {
    padding: 16px;
}

/* Profile */
.profile-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #1e78d7;
    padding: 12px;
    color: white;
    border-radius: 6px;
}

.profile-image-box {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid white;
    margin-bottom: 6px;
}

.profile-image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Rating */
.star-rating {
    text-align: center;
    margin: 12px 0;
}

.star-rating > label {
    display: block;
    font-weight: 600;
    font-size: 0.85rem;
    margin-bottom: 6px;
}

.stars {
    display: flex;
    flex-direction: row-reverse;
    justify-content: center;
    gap: 4px;
}

.stars input { display: none; }

.stars label {
    cursor: pointer;
    font-size: 1.8rem;
    color: #e0e0e0;
    transition: 0.2s;
}

.stars label:hover,
.stars label:hover ~ label,
.stars input:checked ~ label {
    color: #ffc107;
}

/* Review */
.review-input {
    margin-bottom: 12px;
}

.review-input label {
    font-weight: 600;
    font-size: 0.8rem;
    margin-bottom: 4px;
    display: block;
}

.review-input textarea {
    width: 100%;
    padding: 8px;
    border: 2px solid #e0e0e0;
    border-radius: 6px;
    font-size: 0.85rem;
    min-height: 70px;
}

/* Buttons */
.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.btn {
    padding: 6px 14px;
    border: none;
    border-radius: 5px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
}

.btn-primary {
    background: #1976d2;
    color: white;
}

.btn-secondary {
    background: #eceff1;
    color: #546e7a;
}

/* Rating Text */
.rating-text {
    text-align: center;
    color: #1976d2;
    font-weight: 600;
    margin-top: 4px;
    font-size: 0.8rem;
}

/* Mobile */
@media (max-width: 480px) {
    .modal-container {
        max-width: 95%;
    }
}

</style>
{% endblock %} {% block main-content %} 

<div class="modal-overlay">
        <div class="modal-container">
            <!-- Modal Header -->
            <div class="modal-header">
                <h2>Rate & Review</h2>
                <p>Share your experience with us</p>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <div class="profile-header">
    <div class="profile-image-box">
        {% if professional.profile_picture %}
            <img src="{{ professional.profile_picture.url }}" alt="{{ professional.user.full_name }}">
        {% else %}
            <img src="{% static 'profile_pictures/images.png' %}"alt="Default User">
        {% endif %}
    </div>

    <h2>{{ professional.user.full_name }}</h2>
</div>
<br>


                <!-- If user is authenticated -->
                <form id="reviewForm" data-professional-id="{{ professional.id }}">
                    <!-- Star Rating -->
                    <div class="star-rating">
                        <label>Your Rating</label>
                        <div class="stars">
                            <input type="radio" name="rating" value="5" id="star5" required>
                            <label for="star5">★</label>
                            <input type="radio" name="rating" value="4" id="star4">
                            <label for="star4">★</label>
                            <input type="radio" name="rating" value="3" id="star3">
                            <label for="star3">★</label>
                            <input type="radio" name="rating" value="2" id="star2">
                            <label for="star2">★</label>
                            <input type="radio" name="rating" value="1" id="star1">
                            <label for="star1">★</label>
                        </div>
                        <div class="rating-text" id="ratingText"></div>
                    </div>

                    <!-- Review Textarea -->
                    <div class="review-input">
                        <label>Your Review(Optional)</label>
                        <textarea 
                            name="comment" 
                            placeholder="Tell us about your experience..."
                            
                        ></textarea>
                    </div>

                    <!-- Action Buttons -->
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Post</button>
                    </div>
                </form>

                <!-- If user is NOT authenticated (uncomment to test) -->
                <!-- <div class="login-message">
                    <p>Please <a href="#">login</a> to leave a review.</p>
                </div> -->
            </div>
        </div>
    </div>

     <script>
document.addEventListener("DOMContentLoaded", () => {
    // Star rating interaction
    const stars = document.querySelectorAll('.stars input[type="radio"]');
    const ratingText = document.getElementById('ratingText');
    
    const ratingMessages = {
        1: 'Poor',
        2: 'Fair',
        3: 'Good',
        4: 'Very Good',
        5: 'Excellent'
    };

    stars.forEach(star => {
        star.addEventListener('change', function() {
            const value = this.value;
            ratingText.textContent = ratingMessages[value];
        });
    });

    // Form submission
    const form = document.getElementById('reviewForm');
    
    if (form) {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const professionalId = this.dataset.professionalId;
            const formData = new FormData(this);
            
            // Check if rating is selected
            const rating = formData.get('rating');
            if (!rating) {
                alert('Please select a rating');
                return;
            }
            
            fetch(`/review/${professionalId}/`, {
                method: "POST",
                headers: {
                    "X-CSRFToken": getCookie('csrftoken')
                },
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    window.location.href = `/`;  // Redirect back to professional profile
                } else {
                    alert(data.error || "Error submitting review");
                }
            })
            .catch(err => {
                console.error("Error submitting review:", err);
                alert("Network error — please try again.");
            });
        });
    }

   
document.querySelector('.btn-secondary')?.addEventListener('click', closeModal);

document.querySelector('.modal-overlay')?.addEventListener('click', function (e) {
    if (e.target === this) closeModal();
});

    // Get CSRF token
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
});
 function closeModal() {
    window.history.back();
}

</script>
{% endblock %}
