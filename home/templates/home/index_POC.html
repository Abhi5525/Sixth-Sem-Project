<!DOCTYPE html>
<html>
<head>
    <title>GalliMaps Integration</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(45deg, #2c5282, #3182ce);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 300;
        }
        
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
        }
        
        .content {
            padding: 20px;
        }
        
        #map { 
            height: 600px; 
            width: 100%; 
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 2px solid #e2e8f0;
        }
        
        .info-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .info-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #3182ce;
        }
        
        .info-card h3 {
            margin: 0 0 10px 0;
            color: #2d3748;
        }
        
        .coordinates {
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2b6cb0;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #e53e3e;
        }
        
        .status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .status.success {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .status.loading {
            background: #fbb6ce;
            color: #702459;
        }
        
        @media (max-width: 768px) {
            .info-panel {
                grid-template-columns: 1fr;
            }
            
            #map {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>GalliMaps Integration</h1>
            <p>Interactive map with backend API key proxy for secure token management</p>
        </div>
        
        <div class="content">
            <div id="error-message" class="error" style="display: none;"></div>
            
            <div id="loading" class="loading">
                <div class="status loading">Loading map...</div>
                <p>Fetching API token from backend...</p>
            </div>
            
            <div id="map-container" style="display: none;">
                <div id="map"></div>
                
                <div class="info-panel">
                    <div class="info-card">
                        <h3>📍 Current Coordinates</h3>
                        <div class="coordinates" id="coords">Click on map to get coordinates</div>
                    </div>
                    
                    <div class="info-card">
                        <h3>🗺️ Map Status</h3>
                        <div class="status success">GalliMaps Loaded Successfully</div>
                        <p style="margin-top: 10px; font-size: 0.9rem; color: #666;">
                            API key securely managed via Django backend
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        class GalliMapsIntegration {
            constructor() {
                this.map = null;
                this.token = null;
                this.init();
            }
            
            async init() {
                try {
                    await this.fetchToken();
                    this.initializeMap();
                    this.hideLoading();
                } catch (error) {
                    this.showError(error.message);
                }
            }
            
            async fetchToken() {
                try {
                    // For demo purposes, we'll simulate the backend call
                    // In your actual Django app, this would be:
                    // const response = await fetch("/api/gallimaps-token/");
                    
                    // Simulating API call delay
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    // Simulated response - replace with actual fetch call
                    const mockResponse = {
                        token: "fcc76e0a-38eb-449e-8386-218b935bc95c",
                        status: "success"
                    };
                    
                    if (!mockResponse.token) {
                        throw new Error('No API token received from backend');
                    }
                    
                    this.token = mockResponse.token;
                    console.log('GalliMaps token fetched successfully');
                    
                } catch (error) {
                    console.error('Error fetching GalliMaps token:', error);
                    throw new Error(`Failed to fetch API token: ${error.message}`);
                }
            }
            
            initializeMap() {
                if (!this.token) {
                    throw new Error('No API token available');
                }
                
                // Initialize map centered on Kathmandu, Nepal
                this.map = L.map('map').setView([27.7172, 85.3240], 13);
                
                // Add GalliMaps tile layer
                const galliLayer = L.tileLayer(`https://maps.gallimap.com/tiles/{z}/{x}/{y}.png?access_token=${this.token}`, {
                    attribution: '&copy; <a href="https://gallimap.com/">Galli Maps</a>',
                    maxZoom: 18,
                    tileSize: 256,
                    zoomOffset: 0
                });
                
                galliLayer.addTo(this.map);
                
                // Handle tile loading errors
                galliLayer.on('tileerror', (e) => {
                    console.warn('Tile loading error:', e);
                });
                
                // Add click handler for coordinates
                this.map.on('click', (e) => {
                    this.updateCoordinates(e.latlng);
                });
                
                // Add a marker at the center
                const centerMarker = L.marker([27.7172, 85.3240])
                    .addTo(this.map)
                    .bindPopup(`
                        <div style="text-align: center;">
                            <h4>📍 Kathmandu, Nepal</h4>
                            <p>Click anywhere on the map to get coordinates</p>
                        </div>
                    `);
                
                console.log('GalliMaps initialized successfully');
            }
            
            updateCoordinates(latlng) {
                const lat = latlng.lat.toFixed(6);
                const lng = latlng.lng.toFixed(6);
                
                const coordsElement = document.getElementById('coords');
                coordsElement.innerHTML = `
                    <div>Lat: <span style="color: #e53e3e">${lat}</span></div>
                    <div>Lng: <span style="color: #e53e3e">${lng}</span></div>
                `;
                
                // Add a temporary marker at clicked location
                if (this.clickMarker) {
                    this.map.removeLayer(this.clickMarker);
                }
                
                this.clickMarker = L.marker([lat, lng])
                    .addTo(this.map)
                    .bindPopup(`
                        <div>
                            <strong>Selected Location</strong><br>
                            Lat: ${lat}<br>
                            Lng: ${lng}
                        </div>
                    `)
                    .openPopup();
            }
            
            hideLoading() {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('map-container').style.display = 'block';
            }
            
            showError(message) {
                const errorElement = document.getElementById('error-message');
                errorElement.textContent = `Error: ${message}`;
                errorElement.style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        // Initialize the application when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new GalliMapsIntegration();
        });
        
        // Add some helpful console information
        console.log('GalliMaps Integration Demo');
        console.log('This demo shows how to securely integrate GalliMaps using a Django backend proxy');
        console.log('Replace the mock API call with your actual Django endpoint');
    </script>
</body>
</html>
